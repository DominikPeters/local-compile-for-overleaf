<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chrome Web Store Promo Materials — Local Compile for Overleaf</title>
<link rel="stylesheet" href="promo.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mockups.jsx"></script>
<script type="text/babel" src="slides.jsx"></script>
<script type="text/babel" src="tiles.jsx"></script>
<script type="text/babel">
  function App() {
    const slides = window.PROMO_SLIDES;
    const tiles = window.PROMO_TILES;
    const smalls = tiles.filter((t) => t.w === 440);
    const marquees = tiles.filter((t) => t.w === 1400);
    const render = (item) => (
      <DCArtboard key={item.id} id={item.id} label={item.name} width={item.w} height={item.h}>
        <item.C />
      </DCArtboard>
    );
    return (
      <DesignCanvas>
        <DCSection id="screenshots" title="Carousel screenshots" subtitle="1280×800 · shown on the store listing, in order">
          {slides.map(render)}
        </DCSection>
        <DCSection id="small-tiles" title="Small promo tile" subtitle="440×280 · pick one">
          {smalls.map(render)}
        </DCSection>
        <DCSection id="marquee-tiles" title="Marquee promo tile" subtitle="1400×560 · pick one">
          {marquees.map(render)}
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
