name: TeX Fixtures

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tex-fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tex-fixtures:
    name: Real latexmk fixture tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: native-host/pyproject.toml

      - name: Install TeX Live tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript \
            latexmk \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-luatex \
            texlive-pictures \
            texlive-xetex

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e native-host pytest

      - name: Run real TeX fixture tests
        run: python -m pytest native-host/tests -m tex
